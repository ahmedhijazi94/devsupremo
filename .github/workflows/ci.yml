name: Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Tipos, lint e auditoria
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run audit:security -- --strict
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: security-audit
          path: docs/security-audit/last-audit.json
          retention-days: 14

  test:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # O smoke test do scaffold (src/lib/templates/scaffold-smoke.test.ts) roda
      # o BIN REAL da CLI contra os scripts que o template gera — precisa estar
      # buildado com o CÓDIGO ATUAL, não um dist/ comitado potencialmente
      # desatualizado (foi exatamente esse desalinhamento fonte↔build publicado
      # que causou "unknown option '--status'" em produção).
      - name: Buildar a CLI (packages/cli) para o smoke test
        working-directory: packages/cli
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: npm run test:coverage

  template:
    name: O template gerado compila
    runs-on: ubuntu-latest
    # O bug mais caro que este projeto teve foi gerar projetos com o CI
    # quebrado. A única forma honesta de garantir que não volta é gerar um
    # projeto de verdade e rodar os gates dele aqui.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # O mesmo script que se roda localmente — uma definição só, para o
      # que roda aqui não divergir do que se verifica na máquina.
      - name: Gerar projeto e rodar os gates dele
        run: ./scripts/dev/verify-template.sh /tmp/generated

  dependencies:
    name: Vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # npm audit --audit-level=high continua obrigatório e fail-closed.
      # O guard só adiciona retry limitado para instabilidade transitória
      # de infraestrutura/rede do registry (429/5xx, timeout, ECONNRESET/
      # ETIMEDOUT...) — vulnerabilidade real ou qualquer outro erro do npm
      # falha imediatamente, sem retry. Ver src/lib/ci/npm-audit-classify.ts.
      - run: npx tsx scripts/npm-audit-guard.mts

  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # CLI oficial do Gitleaks, pinada por versão + checksum — NÃO a Action
      # (gitleaks/gitleaks-action@v2), que hoje exige GITLEAKS_LICENSE mesmo em
      # repo privado de Organization. A CLI em si é sempre gratuita. Mesmo fix
      # aplicado ao template (src/lib/templates/project-files.ts).
      - name: Instalar Gitleaks (CLI oficial, pinada, sem licença)
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Rodar Gitleaks
        run: ./gitleaks detect --source . --redact --exit-code 1 --no-banner

  codeql:
    name: Análise estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    # Independente da cobertura: uma falha de "Testes e cobertura" não pode
    # esconder o resultado do build. Depende só de tipos/lint (pré-requisito
    # real para compilar). Ambos seguem obrigatórios para o merge.
    needs: [quality]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
